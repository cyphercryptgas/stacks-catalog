name: build-wings

on:
  workflow_dispatch:
    inputs:
      wing:
        description: "Which wing to build"
        type: choice
        options: [both, research, law]
        default: both
      per_field:
        description: "Papers per field (research; 640 per room)"
        default: "10240"
      per_court:
        description: "Opinions per court (law; 640 per room)"
        default: "2560"
      per_subject:
        description: "DOAB books per subject hall (research books)"
        default: "640"
      per_title:
        description: "Sections per U.S. Code title (law statutes)"
        default: "1920"
  schedule:
    - cron: "20 7 3 * *" # monthly, the 3rd at 07:20 UTC

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  wings:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: catalog-index
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build research wing (OpenAlex)
        id: research
        if: ${{ github.event_name == 'schedule' || inputs.wing == 'both' || inputs.wing == 'research' }}
        continue-on-error: true
        env:
          PER_FIELD: ${{ inputs.per_field || '10240' }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          OUT: research.db
        run: python scripts/build_wing_research.py

      - name: Append research books (OpenStax + DOAB)
        id: research_books
        if: ${{ (github.event_name == 'schedule' || inputs.wing == 'both' || inputs.wing == 'research') && steps.research.outcome == 'success' }}
        continue-on-error: true
        env:
          PER_SUBJECT: ${{ inputs.per_subject || '640' }}
          OUT: research.db
        run: python scripts/append_research_books.py

      - name: Build law library (CourtListener)
        id: law
        if: ${{ github.event_name == 'schedule' || inputs.wing == 'both' || inputs.wing == 'law' }}
        continue-on-error: true
        env:
          PER_COURT: ${{ inputs.per_court || '2560' }}
          CL_TOKEN: ${{ secrets.CL_TOKEN }}
          OUT: law.db
        run: python scripts/build_wing_law.py

      - name: Append law statutes (U.S. Code + CFR)
        id: law_statutes
        if: ${{ (github.event_name == 'schedule' || inputs.wing == 'both' || inputs.wing == 'law') && steps.law.outcome == 'success' }}
        continue-on-error: true
        env:
          PER_TITLE: ${{ inputs.per_title || '1920' }}
          GOVINFO_KEY: ${{ secrets.GOVINFO_KEY }}
          OUT: law.db
        run: python scripts/append_law_statutes.py

      - name: Publish to the release
        run: |
          set -e
          gh release download "$TAG" -p wings.json -O wings.json || echo '{}' > wings.json
          STAMP="$(date -u +%Y%m%d-%H%M)"
          python - "$STAMP" <<'PY'
          import gzip, json, os, shutil, sys
          stamp = sys.argv[1]
          try:
              wings = json.load(open("wings.json"))
          except Exception:
              wings = {}
          published = []
          for name in ("research", "law"):
              db = name + ".db"
              if not os.path.exists(db) or os.path.getsize(db) < 4096:
                  print("skip", name, "(no usable db)")
                  continue
              with open(db, "rb") as f, gzip.open(db + ".gz", "wb", compresslevel=6) as g:
                  shutil.copyfileobj(f, g)
              wings[name] = {"asset": db + ".gz", "version": stamp}
              published.append(name)
              print(name, "->", os.path.getsize(db + ".gz") // 1048576, "MB gz")
          json.dump(wings, open("wings.json", "w"), indent=1)
          open("published.txt", "w").write(" ".join(published))
          PY
          ASSETS="wings.json"
          [ -f research.db.gz ] && ASSETS="$ASSETS research.db.gz"
          [ -f law.db.gz ] && ASSETS="$ASSETS law.db.gz"
          if [ "$ASSETS" = "wings.json" ]; then
            echo "Neither wing built — nothing to publish."; exit 1
          fi
          gh release upload "$TAG" $ASSETS --clobber
          echo "published: $(cat published.txt)"

      - name: Fail if a requested wing did not build
        if: ${{ steps.research.outcome == 'failure' || steps.law.outcome == 'failure' }}
        run: |
          echo "research: ${{ steps.research.outcome }}"
          echo "law: ${{ steps.law.outcome }}"
          echo "One wing failed to build — see its step log above. Any wing that DID build was still published."
          exit 1
